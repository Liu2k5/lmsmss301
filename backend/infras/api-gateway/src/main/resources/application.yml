server:
  port: 8080
spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8180/realms/lms}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/lms/protocol/openid-connect/certs}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Review phải đứng trước course-service vì dùng chung tiền tố /api/v1/courses/*
            - id: review-service
              uri: lb://review-rating-service
              predicates:
                - Path=/api/v1/courses/*/reviews/**,/api/v1/courses/*/ratings/**,/api/v1/my-reviews,/api/v1/reviews/**,/api/v1/admin/**
            - id: course-service
              uri: lb://course-service
              predicates:
                - Path=/api/v1/courses/**
            - id: course-quizzes
              uri: lb://course-service
              predicates:
                - Path=/api/v1/quizzes/**
            - id: course-sections
              uri: lb://course-service
              predicates:
                - Path=/api/v1/sections/**
            - id: course-lessons
              uri: lb://course-service
              predicates:
                - Path=/api/v1/lessons/**,/api/v1/materials/**
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**,/api/v1/universities/**
            - id: enrollment-service
              uri: lb://enrollment-service
              predicates:
                - Path=/api/v1/enrollments/**
            - id: progress-service
              uri: lb://progress-service
              predicates:
                - Path=/api/v1/progress/**,/api/v1/analytics/**,/api/v1/certificates/**
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health
