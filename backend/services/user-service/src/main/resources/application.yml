server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: user-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/lms}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/lms/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

keycloak:
  url: ${KEYCLOAK_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:lms}
  client-id: user-service
  client-secret: ${KEYCLOAK_CLIENT_SECRET:qjdF1uPMYV9BPDoqs8NexL7ne2KT11xG3QdXCcswK9qMgpl1YMGXFmWrqImxEuEKhSOmuFQdAQ9lWcZ7MltanF}