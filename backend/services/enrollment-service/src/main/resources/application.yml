server:
  port: 8083
spring:
  application:
    name: enrollment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/enrollment_db}
    username: ${DB_USER:lms}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis
    redis:
      time-to-live: 5m
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:lms}
    password: ${RABBITMQ_PASSWORD:lms}
    virtual-host: ${RABBITMQ_VHOST:/}
app:
  services:
    course:
      url: ${COURSE_SERVICE_URL:http://localhost:8081}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health
