server:
  port: 8084

spring:
  application:
    name: progress-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/progress_db}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:sa}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:lms}
    password: ${RABBITMQ_PASSWORD:rabbit123}
    virtual-host: ${RABBITMQ_VHOST:lms}

  jackson:
    serialization:
#      write-dates-as-timestamps: false
app:
  services:
    # Course Service: lấy đề + đáp án đúng để chấm bài (UC-P04).
    course:
      url: ${COURSE_SERVICE_URL:http://localhost:8081}
    # Enrollment Service: kiểm tra quyền truy cập khi thiếu bản ghi tiến độ (UC-E04).
    enrollment:
      url: ${ENROLLMENT_SERVICE_URL:http://localhost:8083}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
