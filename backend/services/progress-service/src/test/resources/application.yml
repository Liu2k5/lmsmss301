# Test dùng H2 in-memory thay PostgreSQL/MongoDB thật.
spring:
  datasource:
    url: jdbc:h2:mem:progressdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

eureka:
  client:
    enabled: false

app:
  seed-demo-data: false
