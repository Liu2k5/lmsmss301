spring.application.name=review-rating-service
server.port=${PORT:8085}

# Datasource - PostgreSQL (override with environment variables in Docker/Compose)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/review_db}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:sa}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Review & Rating Business Configuration
app.review.require-enrollment=${REQUIRE_ENROLLMENT:true}
# UC-R01: chỉ cho đánh giá khi đã hoàn thành khoá học (admin bỏ qua guard này).
app.review.require-completed-course=${REQUIRE_COMPLETED:true}
app.review.report-threshold-to-hide=${REPORT_THRESHOLD:5}

# Remote Services URLs
app.services.enrollment.url=${ENROLLMENT_SERVICE_URL:http://localhost:8083}
app.services.progress.url=${PROGRESS_SERVICE_URL:http://localhost:8084}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
