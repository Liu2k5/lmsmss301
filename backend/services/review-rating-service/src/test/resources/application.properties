spring.application.name=review-rating-service
spring.profiles.active=mock

# Disable Eureka in test suite
eureka.client.enabled=false

# In-memory H2 database for testing
spring.datasource.url=jdbc:h2:mem:review_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# App Test Settings
app.review.require-enrollment=true
app.review.require-completed-course=false
app.review.report-threshold-to-hide=3
