# Cấu hình cho test: dùng H2 in-memory thay cho PostgreSQL nên test không cần DB thật.
spring.datasource.url=jdbc:h2:mem:coursedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
