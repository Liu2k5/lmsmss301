# Cấu hình cho test: dùng H2 in-memory thay cho PostgreSQL nên test không cần DB thật.
spring.datasource.url=jdbc:h2:mem:coursedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

app.seed-demo-data=false

# Test không cần Eureka Server.
eureka.client.enabled=false

# Đặt URL giả: test không gọi Keycloak, JwtDecoder chỉ cần giá trị để khởi tạo.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:0/realms/lms/protocol/openid-connect/certs
