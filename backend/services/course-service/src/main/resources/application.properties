spring.application.name=course-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/course_db}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:sa}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8180/realms/lms/protocol/openid-connect/certs}

app.seed-demo-data=${SEED_DEMO_DATA:true}

eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin123}
minio.bucket=${MINIO_BUCKET:lms-materials}
minio.region=${MINIO_REGION:us-east-1}
minio.url-expiry-minutes=${MINIO_URL_EXPIRY_MINUTES:120}

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:1GB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:1GB}

# Enrollment Service: kiểm tra học viên đã đăng ký khoá học chưa trước khi trả link học liệu (UC-C30).
app.services.enrollment.url=${ENROLLMENT_SERVICE_URL:http://localhost:8083}
