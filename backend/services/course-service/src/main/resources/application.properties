spring.application.name=course-service
server.port=${SERVER_PORT:8081}

# Datasource — override bằng biến môi trường khi chạy Docker/Compose.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/course_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# Tạo dữ liệu mẫu khi database trống (tiện thử giao diện). Đặt SEED_DEMO_DATA=false để tắt.
app.seed-demo-data=${SEED_DEMO_DATA:true}
