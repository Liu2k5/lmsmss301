spring.application.name=course-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/course_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# JWT của Keycloak cho các API quiz (xem SecurityConfig). Chỉ cần JWK set, không gọi discovery
# lúc khởi động nên service vẫn lên được khi Keycloak chưa sẵn sàng.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8180/realms/lms/protocol/openid-connect/certs}

app.seed-demo-data=${SEED_DEMO_DATA:true}

# Eureka: đăng ký service để API Gateway tìm qua lb://course-service.
# Chưa có Eureka Server thì đặt EUREKA_ENABLED=false để tắt log báo lỗi kết nối.
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# MinIO lưu video / tài liệu bài học. Chạy MinIO local: docker compose up -d (trong thư mục course-service).
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:course-materials}
minio.region=${MINIO_REGION:us-east-1}
# Thời hạn link xem file (presigned URL) trả cho client, tính bằng phút.
minio.url-expiry-minutes=${MINIO_URL_EXPIRY_MINUTES:120}

# Giới hạn dung lượng upload (video có thể lớn).
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:1GB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:1GB}
