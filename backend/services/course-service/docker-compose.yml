# MinIO cho course-service khi chạy local.
#   docker compose up -d      → API: http://localhost:9000, giao diện quản trị: http://localhost:9001
#   Đăng nhập giao diện quản trị: minioadmin / minioadmin (chỉ dùng cho môi trường dev)
# Bucket "course-materials" được course-service tự tạo ở lần upload đầu tiên.
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: course-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
