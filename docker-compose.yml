name: lmsmss301

services:
  # ---------- HẠ TẦNG ----------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sa}
      POSTGRES_DB: ${POSTGRES_DB:-sa}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sa}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservice_net

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin123}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:-sa}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-sa}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8181        # token có issuer là localhost:8181
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"   # container vẫn gọi được qua keycloak:8080
    ports:
      - "8181:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservice_net

  user-service:
    build:
      context: ./backend/services/user-service
    container_name: user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sa}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-sa}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-lms}
      KEYCLOAK_CLIENT_SECRET: ${USER_SERVICE_KC_SECRET}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      JWT_ISSUER_URI: http://localhost:8181/realms/lms
      JWT_JWK_SET_URI: http://keycloak:8080/realms/lms/protocol/openid-connect/certs
      EUREKA_CLIENT_ENABLED: "false"            # bỏ dòng này khi đã có Eureka (bước 7.9)
    ports:
      - "8083:8083"                             # để test trực tiếp; sau này gateway mới là cửa vào
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservice_net

volumes:
  postgres_data:

networks:
  microservice_net: